name: Agent météo plante

on:
  schedule:
    # Toutes les 3 h (heures UTC) -> en heure d'été : 3h17, 6h17 ... 18h17, 21h17 à Paris
    - cron: "17 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = message Telegram de test ; run = passage normal ; dry = test sans envoi (affiché dans les logs)"
        type: choice
        options: [test, run, dry]
        default: test

permissions:
  contents: write   # pour sauvegarder state.json (mémoire de l'agent)

concurrency:
  group: meteo-plante
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la météo et alerter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.mode == 'dry' && '1' || '' }}
        run: python3 meteo_plante.py ${{ (github.event.inputs.mode == 'dry' && 'test') || github.event.inputs.mode || 'run' }}

      - name: Sauvegarder l'état
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "agent-meteo"
          git config user.email "agent-meteo@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Mise à jour de l'état" && git push)
